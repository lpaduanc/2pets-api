6:35.000000Z"},{"id":19,"name":"Doenca de Addison","description":"Hipoadrenocorticismo causado pela producao insuficiente de hormonios adrenais, podendo causar crises graves.","species":"dog","category":"metabolic","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"},{"id":18,"name":"Doenca de Cushing","description":"Hiperadrenocorticismo causado pela producao excessiva de cortisol, comum em caes de meia-idade e idosos.","species":"dog","category":"metabolic","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"},{"id":14,"name":"Doenca Inflamatoria Intestinal","description":"Grupo de doencas que causam inflamacao cronica do trato gastrointestinal, resultando em vomitos e diarreia.","species":null,"category":"gastrointestinal","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"},{"id":11,"name":"Doenca Periodontal","description":"Infeccao das estruturas de suporte dos dentes (gengiva e osso), muito prevalente em caes e gatos.","species":null,"category":"dental","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"},{"id":7,"name":"Doenca Renal Cronica","description":"Perda progressiva e irreversivel da funcao renal, comum em gatos idosos e caes de idade avancada.","species":null,"category":"renal","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"},{"id":3,"name":"Epilepsia","description":"Disturbio neurologico caracterizado por convulsoes recorrentes devido a atividade eletrica anormal no cerebro.","species":null,"category":"neurological","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"},{"id":17,"name":"Glaucoma","description":"Aumento da pressao intraocular que pode danificar o nervo optico e causar perda de visao.","species":null,"category":"ophthalmological","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"},{"id":4,"name":"Hipertireoidismo","description":"Producao excessiva de hormonios tireoidianos, comum em gatos idosos, causando perda de peso e hiperatividade.","species":"cat","category":"metabolic","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"},{"id":5,"name":"Hipotireoidismo","description":"Producao insuficiente de hormonios tireoidianos, comum em caes, causando letargia, ganho de peso e problemas de pele.","species":"dog","category":"metabolic","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"},{"id":12,"name":"Insuficiencia Cardiaca Congestiva","description":"Condicao em que o coracao nao bombeia sangue de forma eficiente, causando acumulo de liquidos no corpo.","species":null,"category":"cardiac","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"},{"id":20,"name":"Leishmaniose","description":"Doenca infecciosa transmitida por flebotomineos, que afeta multiplos orgaos e requer tratamento prolongado.","species":"dog","category":"infectious","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"},{"id":9,"name":"Obesidade","description":"Acumulo excessivo de gordura corporal que compromete a saude e qualidade de vida do animal.","species":null,"category":"metabolic","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"},{"id":13,"name":"Pancreatite Cronica","description":"Inflamacao persistente do pancreas que prejudica a digestao e pode causar dor abdominal recorrente.","species":null,"category":"gastrointestinal","created_at":"2026-04-08T20:46:35.000000Z","updated_at":"2026-04-08T20:46:35.000000Z"}]'
